openapi: 3.0.3
info:
  title: CardBattle API
  version: 1.0.0
  description: |
    Implemented card, deck management/membership, inventory creation/listing, Google authentication, and display-name routes.
    Other controller TODOs are excluded until implemented. All routes except health
    require a verified Google ID token. Errors are described by status code; the
    application does not currently guarantee a uniform error response body.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Cards
    description: Authored card management and the shared catalog.
  - name: Decks
    description: Owner-only deck listing, creation, lookup, renaming, deletion, and membership management.
  - name: Inventory
    description: Create and list the signed-in user's inventory copies.
  - name: Authentication
    description: Google identity verification and backend user registration.
  - name: Users
    description: The signed-in user's profile.
  - name: Health
    description: Service health.
paths:
  /api/v1/inventory:
    get:
      tags: [Inventory]
      operationId: listInventory
      summary: List inventory copies owned by the signed-in user
      description: Ordered by inventory ID ascending. Type filtering happens before counting/pagination. Optional userId can only narrow the caller's inventory. Unknown/other user IDs, unregistered callers, or empty matches return an empty page. Broken legacy card/author references on the requested page return 409.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Type'
        - name: userId
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Inventory page with embedded card details and matching totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnershipPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      tags: [Inventory]
      operationId: createOwnership
      summary: Add an existing card to the signed-in user's inventory
      description: Requires prior Google user registration. userId must match the authenticated user; cardId is Card.id, not an inventory ID. Repeated requests create distinct copies. This basic route allows self-acquisition; it does not verify purchases, rewards, or scarcity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnershipCreate'
      responses:
        '201':
          description: Created inventory copy with embedded card details. Its id can be passed as cardId when adding a deck entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ownership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/decks:
    get:
      tags: [Decks]
      operationId: listDecks
      summary: List decks owned by the signed-in user
      description: Optional userId only narrows the caller's own decks; another user's ID gives an empty page. Empty matches or out-of-range pages return 200 with empty content and matching totals.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: userId
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: sort
          in: query
          description: Equal names use ascending ID as a secondary sort.
          schema:
            type: string
            enum: ['name,asc', 'name,desc', 'id,asc', 'id,desc']
            default: 'name,asc'
      responses:
        '200':
          description: A page of the caller's decks; an unregistered caller gets an empty page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Decks]
      operationId: createDeck
      summary: Create an empty deck owned by the signed-in user
      description: Requires a user registered through Google sign-in. Owner identity comes from the token, not the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckCreate'
      responses:
        '201':
          description: Created empty deck. Repeated requests create separate decks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/decks/{deckId}:
    parameters:
      - name: deckId
        in: path
        required: true
        schema:
          type: integer
          format: int32
    get:
      tags: [Decks]
      operationId: getDeck
      summary: Get metadata for a deck owned by the signed-in user
      description: Missing decks and other users' decks return 404. Does not include card membership.
      responses:
        '200':
          description: The requested deck.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Decks]
      operationId: updateDeck
      summary: Rename a deck owned by the signed-in user
      description: Only name is editable. Omitted name is a no-op; explicit null is rejected. Unknown fields are ignored. Ownership, membership, and creation timestamp are not editable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckPatch'
      responses:
        '200':
          description: Renamed or unchanged deck.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Decks]
      operationId: deleteDeck
      summary: Delete a deck owned by the signed-in user
      description: Removes deck membership rows and the deck in one transaction. Cards, inventory, other decks, users, and battle history remain. Any blocking constraint rolls back both deletions.
      responses:
        '204':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/decks/{deckId}/cards:
    parameters:
      - $ref: '#/components/parameters/DeckId'
    get:
      tags: [Decks]
      operationId: listDeckCards
      summary: List membership rows in a deck owned by the signed-in user
      description: Returns an array in ascending membership-ID order, not a paginated response. Empty decks return an empty array. Outer cardId is an inventory ID; nested card contains the underlying Card details and its own ID. Legacy membership type metadata may be null. Missing or other users' decks return 404. Broken inventory/card references return 409 without modifying data.
      responses:
        '200':
          description: Deck membership metadata with embedded card details.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeckCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      tags: [Decks]
      operationId: addCardToDeck
      summary: Add one of your inventory copies to your deck
      description: cardId is User_owns_card.id, not Card.id. userId must match the signed-in owner. The response embeds underlying card details. No deck-size or duplicate-entry rules are enforced in this batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckCardCreate'
      responses:
        '201':
          description: Created membership row with a generated ID; inventory is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/decks/{deckId}/cards/{cardInDeckId}:
    parameters:
      - $ref: '#/components/parameters/DeckId'
      - name: cardInDeckId
        in: path
        required: true
        schema:
          type: integer
          format: int32
    patch:
      tags: [Decks]
      operationId: updateDeckCard
      summary: Update the membership type metadata in your deck
      description: The membership must belong to the deck in the path. Does not change the underlying Card.type or other embedded card fields. The response includes current underlying card details. Omitted type is a no-op; explicit null or an invalid enum is rejected. Other fields are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckCardPatch'
      responses:
        '200':
          description: Updated or unchanged membership with embedded card details. Broken inventory/card references return 409.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Decks]
      operationId: removeCardFromDeck
      summary: Remove a membership row from your deck
      description: Deletes only Card_in_deck. Inventory, cards, decks, other membership rows, and battle history remain.
      responses:
        '204':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/cards:
    get:
      tags: [Cards]
      operationId: listMyCards
      summary: List cards authored by the signed-in user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
            $ref: '#/components/responses/CardPage'
        '400':
            $ref: '#/components/responses/BadRequest'
        '401':
            $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Cards]
      operationId: createCard
      summary: Create a card with the signed-in user as author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCreate'
      responses:
        '201':
            $ref: '#/components/responses/CardCreated'
        '400':
            $ref: '#/components/responses/BadRequest'
        '401':
            $ref: '#/components/responses/Unauthorized'
        '404':
            $ref: '#/components/responses/NotFound'
  /api/v1/cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      tags: [Cards]
      operationId: getMyCard
      summary: Get a card authored by the signed-in user
      responses:
        '200':
            $ref: '#/components/responses/Card'
        '400':
            $ref: '#/components/responses/BadRequest'
        '401':
            $ref: '#/components/responses/Unauthorized'
        '404':
            $ref: '#/components/responses/NotFound'
    patch:
      tags: [Cards]
      operationId: updateCard
      summary: Partially update an authored card
      description: Omitted fields stay unchanged. Null clears optional fields only. An empty object is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPatch'
      responses:
        '200':
            $ref: '#/components/responses/Card'
        '400':
            $ref: '#/components/responses/BadRequest'
        '401':
            $ref: '#/components/responses/Unauthorized'
        '404':
            $ref: '#/components/responses/NotFound'
    delete:
      tags: [Cards]
      operationId: deleteCard
      summary: Delete an authored card
      description: Deletes inventory and deck entries through foreign keys; decks and battle results remain, with removed battle-card references set to null.
      responses:
        '204':
            $ref: '#/components/responses/Deleted'
        '400':
            $ref: '#/components/responses/BadRequest'
        '401':
            $ref: '#/components/responses/Unauthorized'
        '404':
            $ref: '#/components/responses/NotFound'
        '409':
            $ref: '#/components/responses/Conflict'
  /api/v1/allCards:
    get:
      tags: [Cards]
      operationId: listAllCards
      summary: List cards from all authors
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Author'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
            $ref: '#/components/responses/CardPage'
        '400':
            $ref: '#/components/responses/BadRequest'
        '401':
            $ref: '#/components/responses/Unauthorized'
  /api/v1/allCards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      tags: [Cards]
      operationId: getPublicCard
      summary: Get any author's card
      description: Public catalog access still requires authentication.
      responses:
        '200':
            $ref: '#/components/responses/Card'
        '400':
            $ref: '#/components/responses/BadRequest'
        '401':
            $ref: '#/components/responses/Unauthorized'
        '404':
            $ref: '#/components/responses/NotFound'
  /api/v1/randomCard:
    get:
      tags: [Cards]
      operationId: getRandomCard
      summary: Get a random card from the catalog
      description: Returns 404 when no cards match. Does not add the card to inventory.
      parameters:
        - $ref: '#/components/parameters/Type'
      responses:
        '200':
            $ref: '#/components/responses/Card'
        '400':
            $ref: '#/components/responses/BadRequest'
        '401':
            $ref: '#/components/responses/Unauthorized'
        '404':
            $ref: '#/components/responses/NotFound'
  /api/v1/cards/{cardId}/stats:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      tags: [Cards]
      operationId: getCardStats
      summary: Get battle statistics across all inventory copies of a card
      description: Any authenticated user can read stats. Existing cards without results return zeros; null inventory references cannot be attributed to a card.
      responses:
        '200':
            $ref: '#/components/responses/Stats'
        '400':
            $ref: '#/components/responses/BadRequest'
        '401':
            $ref: '#/components/responses/Unauthorized'
        '404':
            $ref: '#/components/responses/NotFound'
  /api/v1/auth/google:
    post:
      tags: [Authentication]
      operationId: googleSignIn
      summary: Register or sign in using a verified Google token
      description: The Authorization bearer token supplies identity. First sign-in returns 201; later sign-ins return 200 and refresh the stored Google display name.
      responses:
        '200':
            $ref: '#/components/responses/User'
        '201':
            $ref: '#/components/responses/UserCreated'
        '400':
            $ref: '#/components/responses/BadRequest'
        '401':
            $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getGoogleIdentity
      summary: Get verified Google token claims
      description: Returns token claims rather than the stored database profile.
      responses:
        '200':
            $ref: '#/components/responses/GoogleIdentity'
        '401':
            $ref: '#/components/responses/Unauthorized'
  /api/v1/users/me/display-name:
    put:
      tags: [Users]
      operationId: updateDisplayName
      summary: Replace the signed-in user's display name
      description: Trims the name and rejects blank values. The next Google sign-in refreshes this value from Google.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisplayNameUpdate'
      responses:
        '200':
            $ref: '#/components/responses/User'
        '400':
            $ref: '#/components/responses/BadRequest'
        '401':
            $ref: '#/components/responses/Unauthorized'
        '404':
            $ref: '#/components/responses/NotFound'
  /actuator/health:
    get:
      tags: [Health]
      operationId: health
      summary: Check service health
      security: []
      responses:
        '200':
          description: Service is healthy.
        '503':
          description: A health check failed.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google-issued ID token targeting the configured Google Web client ID.
  parameters:
    DeckId:
      name: deckId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    Page:
      name: page
      in: query
      description: Zero-based page number. Pages beyond the end return empty content.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Type:
      name: type
      in: query
      schema:
        $ref: '#/components/schemas/CardType'
    Author:
      name: author
      in: query
      description: Filter by the author's database user ID.
      schema:
        type: integer
        format: int32
        minimum: 1
    Sort:
      name: sort
      in: query
      description: Equal names/types use ascending ID as a secondary sort.
      schema:
        type: string
        enum: ['name,asc', 'name,desc', 'id,asc', 'id,desc', 'type,asc', 'type,desc']
        default: 'name,asc'
  schemas:
    Ownership:
      type: object
      required: [id, userId, cardId, value, card]
      properties:
        id:
          type: integer
          format: int64
          description: User_owns_card.id, the inventory copy ID used by deck membership requests.
        userId:
          type: integer
          format: int64
        cardId:
          type: integer
          format: int64
          description: The underlying Card.id (unlike DeckCard.cardId, which is an inventory ID).
        value:
          type: integer
          format: int32
          nullable: true
          description: Existing legacy values are preserved, including null. New copies require a nonnegative value.
        card:
          $ref: '#/components/schemas/Card'
    OwnershipCreate:
      type: object
      required: [userId, cardId, value]
      properties:
        userId:
          type: integer
          format: int64
          description: Must match the authenticated user.
        cardId:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
          description: ID of an existing Card definition.
        value:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
    OwnershipPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Ownership'
        page:
          $ref: '#/components/schemas/PageMeta'
    DeckPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Deck'
        page:
          $ref: '#/components/schemas/PageMeta'
    DeckPatch:
      type: object
      description: Empty object is a no-op. Only name is editable; explicit null is invalid.
      properties:
        name:
          type: string
          description: Trimmed before validation; the trimmed name must contain 1 to 150 characters.
    DeckCard:
      type: object
      required: [id, deckId, cardId, userId, type, card]
      properties:
        id:
          type: integer
          format: int64
          description: Card_in_deck.id; use this as cardInDeckId for PATCH and DELETE.
        deckId:
          type: integer
          format: int64
        cardId:
          type: integer
          format: int64
          description: User_owns_card.id, not Card.id.
        userId:
          type: integer
          format: int64
          description: Authenticated deck owner's ID.
        type:
          type: string
          nullable: true
          enum: [WARRIOR, BRAWLER, RANGER, MAGE, ROGUE, null]
          description: Membership metadata; older rows may be null.
        card:
          $ref: '#/components/schemas/Card'
    DeckCardCreate:
      type: object
      required: [cardId, userId, type]
      properties:
        cardId:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
          description: An inventory ID owned by the signed-in user.
        userId:
          type: integer
          format: int64
          description: Must match the authenticated deck owner.
        type:
          $ref: '#/components/schemas/CardType'
    DeckCardPatch:
      type: object
      description: Empty object is a no-op. Only type is editable; explicit null is invalid.
      properties:
        type:
          $ref: '#/components/schemas/CardType'
    Deck:
      type: object
      required: [id, userId, name, createdAt]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
          nullable: true
          description: Always null; the database has no creation timestamp column.
    DeckCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Trimmed before validation; the trimmed name must contain 1 to 150 characters.
    CardType:
      type: string
      enum: [WARRIOR, BRAWLER, RANGER, MAGE, ROGUE]
    Card:
      type: object
      required: [id, name, imgURL, description, type, authorId]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        imgURL:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        type:
          $ref: '#/components/schemas/CardType'
        authorId:
          type: integer
          format: int64
          readOnly: true
    CardCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          description: Trimmed before validation; the trimmed name must contain 1 to 150 characters.
        imgURL:
          type: string
          nullable: true
          maxLength: 500
        description:
          type: string
          nullable: true
        type:
          $ref: '#/components/schemas/CardType'
    CardPatch:
      type: object
      description: |
        Every field is optional. Omitted fields remain unchanged; explicit null
        clears imgURL or description. Null name/type is invalid. An empty object
        is a no-op. ID/author are not editable; unknown properties are ignored.
      properties:
        name:
          type: string
          description: Trimmed before validation; the trimmed name must contain 1 to 150 characters.
        imgURL:
          type: string
          nullable: true
          maxLength: 500
        description:
          type: string
          nullable: true
        type:
          $ref: '#/components/schemas/CardType'
    PageMeta:
      type: object
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
        number:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    CardPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        page:
          $ref: '#/components/schemas/PageMeta'
    Stats:
      type: object
      required: [wins, losses, totalBattles, winRate]
      properties:
        wins:
          type: integer
        losses:
          type: integer
        totalBattles:
          type: integer
          description: Battle rows involving the card; a same-card match counts once.
        winRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Wins divided by wins plus losses, or zero with no results.
    User:
      type: object
      required: [id, email, displayName, isAdmin]
      properties:
        id:
          type: integer
          format: int32
          nullable: true
        email:
          type: string
        displayName:
          type: string
        isAdmin:
          type: boolean
    GoogleIdentity:
      type: object
      required: [googleSubject, email, name]
      properties:
        googleSubject:
          type: string
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
    DisplayNameUpdate:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          description: Trimmed and rejected if blank.
  responses:
    Card:
      description: The requested or updated card.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Card'
    CardCreated:
      description: Created card. Repeated POST requests create separate cards.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Card'
    CardPage:
      description: Filtered page and matching totals. Empty matches return 200.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CardPage'
    Stats:
