name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify backend build and tests
        run: ./gradlew verify --no-daemon

      - name: Validate Compose configurations
        working-directory: .
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.local.yml config --quiet

      - name: Build API through Compose
        working-directory: .
        run: docker compose --env-file .env.example build api

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            api-backend/build/reports/jacoco/test/html
            api-backend/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: warn
