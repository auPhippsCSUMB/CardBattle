name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API (backend)

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify backend build and tests
        run: ./gradlew verify --no-daemon

      - name: Build Docker image
        run: docker build --file Dockerfile --tag cardbattle-api:ci .

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            API (backend)/build/reports/jacoco/test/html
            API (backend)/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: warn
